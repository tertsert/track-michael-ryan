<!DOCTYPE html>
<html>
<head>
  <title>Where is Michael?</title>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link href="https://unpkg.com/leaflet/dist/leaflet.css" rel="stylesheet"/>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700&display=swap');
    html, body {
      margin: 0;
      padding: 0;
      font-family: 'Noto Sans', sans-serif;
      background: #fafafa;
      text-align: center;
    }
    .map-wrapper {
      max-width: 1000px;
      margin: 20px auto;
      padding: 0 10px;
      position: relative;
      height: 500px;
      min-height: 300px;
      overflow: hidden;
    }
    #map {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border-radius: 6px;
      z-index: 1;
    }
    #stats {
      font-size: 14px;
      background: rgba(255, 255, 255, 0.85);
      padding: 8px 16px;
      border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
    }
    .controls { margin: 10px; }
    button {
      margin: 0 5px;
      padding: 6px 12px;
      cursor: pointer;
    }
    /* Feed styles */
    #feed {
      max-width: 1000px;
      margin: 40px auto 80px;
      padding: 0 16px;
      text-align: left;
    }
    .feed-item {
      border: 1px solid #e6e6e6;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      padding: 16px;
      margin-bottom: 18px;
      background: #fff;
    }
    .feed-header {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }
    .feed-title {
      font-size: 18px;
      font-weight: 700;
    }
    .feed-date {
      font-size: 14px;
      color: #666;
    }
    .feed-stats {
      font-size: 14px;
      color: #333;
      margin-bottom: 12px;
    }
    .feed-photo {
      width: 100%;
      border-radius: 8px;
      margin: 10px 0 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }
    .feed-map {
      width: 100%;
      height: 250px;
      border-radius: 8px;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="controls">
    <button id="filter-all">Show All</button>
    <button id="filter-bike">Bike Only</button>
    <button id="filter-run">Run Only</button>
  </div>

  <div class="map-wrapper">
    <div id="map"></div>
    <div id="stats">
      <p id="trip-distance">Pacific Coast Distance Traveled: …</p>
      <p id="trip-speed">Average Trip Speed: …</p>
    </div>
  </div>

  <section id="feed"></section>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://unpkg.com/@mapbox/polyline"></script>
  <script>
    const TRIP_START = new Date('2025-07-07T00:00:00Z');

    // === Main map (unchanged style) ===
    const map = L.map('map').setView([39, -123], 5);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    let allLayers = [];

    function drawActivities(data, filterType) {
      allLayers.forEach(layer => map.removeLayer(layer));
      allLayers = [];
      data.forEach(activity => {
        if (
          activity.map &&
          activity.map.summary_polyline &&
          (!filterType || activity.type.toLowerCase() === filterType)
        ) {
          const coords = polyline.decode(activity.map.summary_polyline);
          const latlngs = coords.map(p => [p[0], p[1]]);
          const color = activity.type.toLowerCase() === 'run' ? 'red' : 'blue';
          const layer = L.polyline(latlngs, { color, weight: 2 }).addTo(map);
          allLayers.push(layer);
        }
      });
    }

    function calculateTripStats(data) {
      let totalDistance = 0; // meters
      let totalTime = 0;     // seconds
      data.forEach(a => {
        const d = new Date(a.start_date);
        if (d >= TRIP_START && a.type?.toLowerCase() === 'ride') {
          totalDistance += a.distance;
          totalTime += a.moving_time;
        }
      });
      const miles = totalDistance / 1609.34;
      const mph = totalTime > 0 ? (miles / (totalTime / 3600)) : 0;
      document.getElementById('trip-distance').textContent =
        `Pacific Coast Distance Traveled: ${miles.toFixed(1)} mi`;
      document.getElementById('trip-speed').textContent =
        `Average Trip Speed: ${mph.toFixed(1)} mph`;
    }

    // === Feed helpers ===
    function formatMiles(m) { return (m / 1609.34).toFixed(1); }
    function formatTime(s) {
      const h = Math.floor(s / 3600); const m = Math.round((s % 3600) / 60);
      return h > 0 ? `${h}h ${m}m` : `${m}m`;
    }
    function avgMph(meters, seconds) {
      if (!seconds) return '0.0';
      const miles = meters / 1609.34;
      return (miles / (seconds / 3600)).toFixed(1);
    }
    function formatDate(iso) {
      try {
        const d = new Date(iso);
        return d.toLocaleDateString(undefined, { year:'numeric', month:'short', day:'numeric' });
      } catch { return iso; }
    }
    function primaryPhotoUrl(activity) {
      // Uses Strava summary primary photo if present
      try {
        const urls = activity?.photos?.primary?.urls;
        return urls?.x1200 || urls?.x600 || urls?.x300 || null;
      } catch { return null; }
    }

    function renderFeed(activities) {
      const c = document.getElementById('feed');
      c.innerHTML = '';

      // rides only, since Jul 7; chronological to assign Day N
      const ridesSince = activities
        .filter(a =>
          a?.type?.toLowerCase() === 'ride' &&
          new Date(a.start_date) >= TRIP_START
        )
        .sort((a,b) => new Date(a.start_date) - new Date(b.start_date))
        .map((a, idx) => ({ ...a, __day: idx + 1 }));

      // display newest first
      const items = ridesSince.slice().reverse();

      items.forEach((a, idx) => {
        const card = document.createElement('article');
        card.className = 'feed-item';

        const dateStr = formatDate(a.start_date);
        const dist = formatMiles(a.distance);
        const speed = avgMph(a.distance, a.moving_time);
        const timeStr = formatTime(a.moving_time);

        // header
        const header = document.createElement('div');
        header.className = 'feed-header';
        header.innerHTML = `
          <div class="feed-title">Day ${a.__day}</div>
          <div class="feed-date">• ${dateStr}</div>
        `;

        // stats
        const stats = document.createElement('div');
        stats.className = 'feed-stats';
        stats.textContent = `Distance: ${dist} mi  •  Time: ${timeStr}  •  Avg: ${speed} mph`;

        card.appendChild(header);
        card.appendChild(stats);

        // optional photo
        const photoUrl = primaryPhotoUrl(a);
        if (photoUrl) {
          const img = document.createElement('img');
          img.className = 'feed-photo';
          img.src = photoUrl;
          img.alt = `Photo for Day ${a.__day}`;
          img.loading = 'lazy';
          card.appendChild(img);
        }

        // mini map
        const miniId = `feed-map-${a.id || idx}`;
        const miniDiv = document.createElement('div');
        miniDiv.id = miniId;
        miniDiv.className = 'feed-map';
        card.appendChild(miniDiv);

        c.appendChild(card);

        if (a.map && a.map.summary_polyline) {
          const mini = L.map(miniId, {
            attributionControl: false,
            zoomControl: false,
            dragging: true,
            scrollWheelZoom: false,
            doubleClickZoom: false,
            boxZoom: false,
            keyboard: false,
            tap: false
          });

          // === FREE, NO-TOKEN TILE STYLE ===
          L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            subdomains: 'abcd',
            attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
          }).addTo(mini);

          const coords = polyline.decode(a.map.summary_polyline);
          const latlngs = coords.map(p => [p[0], p[1]]);
          const route = L.polyline(latlngs, {
            color: '#1e88e5',
            weight: 2.5,
            opacity: 0.9,
            lineCap: 'round',
            lineJoin: 'round'
          }).addTo(mini);

          try { mini.fitBounds(route.getBounds(), { padding: [12, 12] }); } catch {}
        } else {
          miniDiv.style.display = 'none';
        }

        // optional “View on Strava” link
        const view = document.createElement('a');
        view.href = `https://www.strava.com/activities/${a.id}`;
        view.target = '_blank';
        view.rel = 'noopener';
        view.textContent = 'View on Strava';
        view.style.display = 'inline-block';
        view.style.marginTop = '8px';
        card.appendChild(view);
      });
    }

    // Load & wire up
    fetch('data/activities.json')
      .then(r => r.json())
      .then(data => {
        drawActivities(data);       // big map (unfiltered)
        calculateTripStats(data);   // overall stats since Jul 7 (rides only)
        renderFeed(data);           // feed with Day N + mini maps

        document.getElementById('filter-all')
          .addEventListener('click', () => drawActivities(data));
        document.getElementById('filter-bike')
          .addEventListener('click', () => drawActivities(data, 'ride'));
        document.getElementById('filter-run')
          .addEventListener('click', () => drawActivities(data, 'run'));
      })
      .catch(err => console.error('Failed to load activities.json', err));
  </script>
</body>
</html>
