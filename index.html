<!DOCTYPE html>
<html>
<head>
  <title>Where is Michael?</title>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link href="https://unpkg.com/leaflet/dist/leaflet.css" rel="stylesheet"/>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700&display=swap');

    html, body {
      margin: 0;
      padding: 0;
      font-family: 'Noto Sans', sans-serif;
      background: #fafafa;
      text-align: center;
    }

    /* Top framed map */
    .map-wrapper {
      max-width: 1000px;
      margin: 20px auto 8px;
      padding: 0 10px;
      position: relative;
      height: 500px;
      min-height: 300px;
      overflow: hidden;
    }
    #map {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border-radius: 6px;
      z-index: 1;
    }

    /* Stats panel below the map (not overlay) */
    .stats-panel {
      max-width: 1000px;
      margin: 0 auto 24px;
      padding: 0 16px;
    }
    .stats-card {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      background: #fff;
      border: 1px solid #e6e6e6;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      padding: 14px;
      text-align: left;
    }
    .stat-label {
      font-size: 12px;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 2px;
      display: block;
    }
    .stat-value {
      font-size: 18px;
      font-weight: 700;
      color: #111;
    }

    /* Feed styles */
    #feed {
      max-width: 1000px;
      margin: 16px auto 80px;
      padding: 0 16px;
      text-align: left;
    }
    .feed-item {
      border: 1px solid #e6e6e6;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      padding: 16px;
      margin-bottom: 18px;
      background: #fff;
    }
    .feed-header {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }
    .feed-title {
      font-size: 18px;
      font-weight: 700;
    }
    .feed-date {
      font-size: 14px;
      color: #666;
    }
    .feed-stats {
      font-size: 14px;
      color: #333;
      margin-bottom: 12px;
    }
    .feed-photo {
      width: 100%;
      border-radius: 8px;
      margin: 10px 0 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }
    .feed-map {
      width: 100%;
      height: 250px;
      border-radius: 8px;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <!-- Main Map -->
  <div class="map-wrapper">
    <div id="map"></div>
  </div>

  <!-- Stats below the map -->
  <section class="stats-panel">
    <div class="stats-card" id="stats">
      <div class="stat">
        <span class="stat-label">Pacific Coast Distance Traveled</span>
        <div class="stat-value" id="trip-distance">…</div>
      </div>
      <div class="stat">
        <span class="stat-label">Average Trip Speed</span>
        <div class="stat-value" id="trip-speed">…</div>
      </div>
      <div class="stat">
        <span class="stat-label">Total Elevation Gain</span>
        <div class="stat-value" id="trip-elev">…</div>
      </div>
    </div>
  </section>

  <!-- Feed -->
  <section id="feed"></section>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://unpkg.com/@mapbox/polyline"></script>
  <script>
    const TRIP_START = new Date('2025-07-06T00:00:00Z');

    // === Main map === (trip rides only)
    const map = L.map('map').setView([39, -123], 5);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    let mapLayers = [];
    function drawTripRidesOnMainMap(data) {
      mapLayers.forEach(l => map.removeLayer(l));
      mapLayers = [];

      const rides = data.filter(a =>
        a?.type?.toLowerCase() === 'ride' &&
        new Date(a.start_date) >= TRIP_START &&
        a?.map?.summary_polyline
      );

      let bounds;
      rides.forEach(a => {
        const coords = polyline.decode(a.map.summary_polyline);
        const latlngs = coords.map(p => [p[0], p[1]]);
        const layer = L.polyline(latlngs, { color: 'blue', weight: 2 }).addTo(map);
        mapLayers.push(layer);
        bounds = bounds ? bounds.extend(layer.getBounds()) : layer.getBounds();
      });

      if (bounds) map.fitBounds(bounds, { padding: [20, 20] });
    }

    // === Helpers ===
    function milesFromMeters(m){ return m / 1609.34; }
    function feetFromMeters(m){ return m * 3.28084; }
    function formatMiles(m){ return milesFromMeters(m).toFixed(1); }
    function formatTime(s){
      const h = Math.floor(s / 3600); const m = Math.round((s % 3600) / 60);
      return h > 0 ? `${h}h ${m}m` : `${m}m`;
    }
    function avgMph(meters, seconds){
      if (!seconds) return 0;
      return milesFromMeters(meters) / (seconds / 3600);
    }
    function formatDate(iso){
      try {
        const d = new Date(iso);
        return d.toLocaleDateString(undefined, { year:'numeric', month:'short', day:'numeric' });
      } catch { return iso; }
    }
    // Day number: days since TRIP_START (inclusive), based on UTC date — Day 1 = July 6
    function dayNumberFromTripStart(iso){
      const d = new Date(iso);
      const rideUTC = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate());
      const startUTC = Date.UTC(TRIP_START.getUTCFullYear(), TRIP_START.getUTCMonth(), TRIP_START.getUTCDate());
      const diffDays = Math.floor((rideUTC - startUTC) / 86400000);
      return diffDays + 1; // Day 1 = Jul 6
    }
    function primaryPhotoUrl(activity){
      try {
        const urls = activity?.photos?.primary?.urls;
        return urls?.x1200 || urls?.x600 || urls?.x300 || null;
      } catch { return null; }
    }

    // === Stats (distance mi, avg mph, total elev ft) ===
    function calculateTripStats(data) {
      let totalDistanceM = 0;  // meters
      let totalTimeS = 0;      // seconds
      let totalElevM = 0;      // meters

      data.forEach(a => {
        const d = new Date(a.start_date);
        if (d >= TRIP_START && a.type?.toLowerCase() === 'ride') {
          totalDistanceM += a.distance || 0;
          totalTimeS += a.moving_time || 0;
          totalElevM += a.total_elevation_gain || 0;
        }
      });

      const miles = milesFromMeters(totalDistanceM);
      const mph = avgMph(totalDistanceM, totalTimeS);
      const elevFeet = feetFromMeters(totalElevM);

      document.getElementById('trip-distance').textContent = `${miles.toFixed(1)} mi`;
      document.getElementById('trip-speed').textContent = `${mph.toFixed(1)} mph`;
      document.getElementById('trip-elev').textContent = `${Math.round(elevFeet).toLocaleString()} ft`;
    }

    // === Feed (bike-only, since start; NEWEST → OLDEST; Day N by calendar) ===
    function renderFeed(data) {
      const c = document.getElementById('feed');
      c.innerHTML = '';

      const rides = data
        .filter(a =>
          a?.type?.toLowerCase() === 'ride' &&
          new Date(a.start_date) >= TRIP_START
        )
        // newest first for display
        .sort((a,b) => new Date(b.start_date) - new Date(a.start_date))
        // attach Day N based on calendar days since trip start
        .map(a => ({ ...a, __day: dayNumberFromTripStart(a.start_date) }));

      rides.forEach((a, idx) => {
        const card = document.createElement('article');
        card.className = 'feed-item';

        const dateStr = formatDate(a.start_date);
        const dist = formatMiles(a.distance || 0);
        const speed = avgMph(a.distance || 0, a.moving_time || 0).toFixed(1);
        const timeStr = formatTime(a.moving_time || 0);

        const header = document.createElement('div');
        header.className = 'feed-header';
        header.innerHTML = `
          <div class="feed-title">Day ${a.__day}</div>
          <div class="feed-date">• ${dateStr}</div>
        `;

        const stats = document.createElement('div');
        stats.className = 'feed-stats';
        stats.textContent = `Distance: ${dist} mi  •  Time: ${timeStr}  •  Avg: ${speed} mph`;

        card.appendChild(header);
        card.appendChild(stats);

        // optional photo
        const photoUrl = primaryPhotoUrl(a);
        if (photoUrl) {
          const img = document.createElement('img');
          img.className = 'feed-photo';
          img.src = photoUrl;
          img.alt = `Photo for Day ${a.__day}`;
          img.loading = 'lazy';
          card.appendChild(img);
        }

        // mini map
        const miniId = `feed-map-${a.id || idx}`;
        const miniDiv = document.createElement('div');
        miniDiv.id = miniId;
        miniDiv.className = 'feed-map';
        card.appendChild(miniDiv);

        c.appendChild(card);

        if (a.map && a.map.summary_polyline) {
          const mini = L.map(miniId, {
            attributionControl: false,
            zoomControl: false,
            dragging: true,
            scrollWheelZoom: false,
            doubleClickZoom: false,
            boxZoom: false,
            keyboard: false,
            tap: false
          });

          // Mini map styling
          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          attribution: '&copy; OpenStreetMap contributors'
          }).addTo(mini);

          const coords = polyline.decode(a.map.summary_polyline);
          const latlngs = coords.map(p => [p[0], p[1]]);
          const route = L.polyline(latlngs, {
            color: 'blue',
            weight: 2.5,
            opacity: 0.9,
            lineCap: 'round',
            lineJoin: 'round'
          }).addTo(mini);

          try { mini.fitBounds(route.getBounds(), { padding: [12, 12] }); } catch {}
        } else {
          miniDiv.style.display = 'none';
        }

        // View on Strava
        const view = document.createElement('a');
        view.href = `https://www.strava.com/activities/${a.id}`;
        view.target = '_blank';
        view.rel = 'noopener';
        view.textContent = 'View on Strava';
        view.style.display = 'inline-block';
        view.style.marginTop = '8px';
        card.appendChild(view);
      });
    }

    // Load & render
    fetch('data/activities.json')
      .then(r => r.json())
      .then(data => {
        drawTripRidesOnMainMap(data);  // main map = trip rides only
        calculateTripStats(data);      // stats = trip rides only
        renderFeed(data);              // feed = newest → oldest, Day N by calendar
      })
      .catch(err => console.error('Failed to load activities.json', err));
  </script>
</body>
</html>
