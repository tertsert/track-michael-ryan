<!DOCTYPE html>
<html>
<head>
  <title>Where is Michael?</title>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link href="https://unpkg.com/leaflet/dist/leaflet.css" rel="stylesheet"/>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700&display=swap');
    html, body {
      margin: 0;
      padding: 0;
      font-family: 'Noto Sans', sans-serif;
      background: #fafafa;
      text-align: center;
    }
    .map-wrapper {
      max-width: 1000px;
      margin: 20px auto;
      padding: 0 10px;
      position: relative;
      height: 500px;
    }
    #map {
      width: 100%;
      height: 100%;
      border-radius: 3px;
    }
    #stats {
      font-size: 14px;
      background: rgba(255, 255, 255, 0.85);
      padding: 8px 16px;
      border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
    }
    .controls { margin: 10px; }
    button {
      margin: 0 5px;
      padding: 6px 12px;
      cursor: pointer;
    }
    /* Feed styles */
    #feed {
      max-width: 1000px;
      margin: 40px auto 80px;
      padding: 0 16px;
      text-align: left;
    }
    .feed-item {
      border: 1px solid #e6e6e6;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      padding: 16px;
      margin-bottom: 18px;
      background: #fff;
    }
    .feed-header {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }
    .feed-title {
      font-size: 18px;
      font-weight: 700;
    }
    .feed-date {
      font-size: 14px;
      color: #666;
    }
    .feed-stats {
      font-size: 14px;
      color: #333;
      margin-bottom: 12px;
    }
    .feed-photo {
      width: 100%;
      border-radius: 8px;
      margin: 10px 0 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }
    .feed-map {
      width: 100%;
      height: 250px;
      border-radius: 8px;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="controls">
    <button id="filter-all">Show All</button>
    <button id="filter-bike">Bike Only</button>
    <button id="filter-run">Run Only</button>
  </div>

  <div class="map-wrapper">
    <div id="map"></div>
    <div id="stats">
      <p id="trip-distance">Pacific Coast Distance Traveled: …</p>
      <p id="trip-speed">Average Trip Speed: …</p>
    </div>
  </div>

  <section id="feed"></section>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://unpkg.com/@mapbox/polyline"></script>
  <script>
    const tripStart = new Date('2025-07-07T00:00:00Z');
    const map = L.map('map').setView([39, -123], 5);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    let allLayers = [];

    function drawActivities(data, filterType) {
      allLayers.forEach(layer => map.removeLayer(layer));
      allLayers = [];
      data.forEach(activity => {
        if (
          activity.map &&
          activity.map.summary_polyline &&
          (!filterType || activity.type.toLowerCase() === filterType)
        ) {
          const coords = polyline.decode(activity.map.summary_polyline);
          const latlngs = coords.map(p => [p[0], p[1]]);
          const color = activity.type.toLowerCase() === 'run' ? 'red' : 'blue';
          const layer = L.polyline(latlngs, { color, weight: 2 }).addTo(map);
          allLayers.push(layer);
        }
      });
    }

    function calculateTripStats(data) {
      let totalDistance = 0;
      let totalTime = 0;
      data.forEach(activity => {
        const activityDate = new Date(activity.start_date);
        if (activityDate >= tripStart && activity.type.toLowerCase() === 'ride') {
          totalDistance += activity.distance;
          totalTime += activity.moving_time;
        }
      });
      const distanceMiles = totalDistance / 1609.34;
      const avgSpeed = totalTime > 0 ? (distanceMiles / (totalTime / 3600)) : 0;
      document.getElementById('trip-distance').textContent =
        `Pacific Coast Distance Traveled: ${distanceMiles.toFixed(1)} mi`;
      document.getElementById('trip-speed').textContent =
        `Average Trip Speed: ${avgSpeed.toFixed(1)} mph`;
    }

    function renderFeed(data) {
      const feedContainer = document.getElementById('feed');
      feedContainer.innerHTML = '';
      const filtered = data.filter(a => {
        const date = new Date(a.start_date);
        return date >= tripStart && a.type.toLowerCase() === 'ride';
      }).sort((a, b) => new Date(a.start_date) - new Date(b.start_date));

      filtered.forEach((activity, index) => {
        const dayNum = index + 1;
        const activityDate = new Date(activity.start_date);
        const dateStr = activityDate.toLocaleDateString();
        const distMiles = (activity.distance / 1609.34).toFixed(1);
        const avgSpeed = ((activity.distance / 1609.34) / (activity.moving_time / 3600)).toFixed(1);

        const item = document.createElement('div');
        item.classList.add('feed-item');

        item.innerHTML = `
          <div class="feed-header">
            <div class="feed-title">Day ${dayNum}</div>
            <div class="feed-date">${dateStr}</div>
          </div>
          <div class="feed-stats">Distance: ${distMiles} mi | Avg Speed: ${avgSpeed} mph</div>
          ${activity.photos && activity.photos.length > 0 ? activity.photos.map(p => `<img class="feed-photo" src="${p}" alt="photo">`).join('') : ''}
          <div class="feed-map" id="feed-map-${index}"></div>
        `;
        feedContainer.appendChild(item);

        // mini map
        const miniMap = L.map(`feed-map-${index}`, {
          zoomControl: false,
          attributionControl: false
        });
        L.tileLayer('https://tile.jawg.io/jawg-light/{z}/{x}/{y}{r}.png?access-token=YOUR_JAWG_ACCESS_TOKEN', {
          attribution: '© OpenStreetMap contributors'
        }).addTo(miniMap);

        const coords = polyline.decode(activity.map.summary_polyline);
        const latlngs = coords.map(p => [p[0], p[1]]);
        const color = 'blue';
        L.polyline(latlngs, { color, weight: 3 }).addTo(miniMap);
        miniMap.fitBounds(L.polyline(latlngs).getBounds());
      });
    }

    fetch('data/activities.json')
      .then(res => res.json())
      .then(data => {
        drawActivities(data);
        calculateTripStats(data);
        renderFeed(data);
        document.getElementById('filter-all').addEventListener('click', () => drawActivities(data));
        document.getElementById('filter-bike').addEventListener('click', () => drawActivities(data, 'ride'));
        document.getElementById('filter-run').addEventListener('click', () => drawActivities(data, 'run'));
      });
  </script>
</body>
</html>
